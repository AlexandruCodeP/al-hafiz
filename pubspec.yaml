name: al_hafiz
description: "A free, open-source, distraction-free Quran memorization app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  just_audio: ^0.9.43
  shared_preferences: ^2.5.3
  provider: ^6.1.5
  google_fonts: ^6.2.1
  http: ^1.3.0
  supabase_flutter: ^2.8.0
  audio_service: ^0.18.15
  just_audio_background: ^0.0.1-beta.13

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/quran.json
    - assets/page_map.json

name: al_hafiz
description: "A free, open-source, distraction-free Quran memorization app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  just_audio: ^0.9.43
  shared_preferences: ^2.5.3
  provider: ^6.1.5
  google_fonts: ^6.2.1
  http: ^1.3.0
  file_picker: ^8.0.0+1
  path_provider: ^2.1.3
  # Mushaf packs: téléchargement repris, dézippage en flux, layout SQLite
  dio: ^5.7.0
  archive: ^3.6.1
  sqflite: ^2.4.1
  path: ^1.9.0
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/quran.json
    - assets/page_map.json
